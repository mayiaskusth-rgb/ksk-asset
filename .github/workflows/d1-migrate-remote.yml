name: Apply Cloudflare D1 migrations (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_remote_migration:
        description: "Explicitly confirm applying pending migrations to ksk-research-dev"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ksk-research-dev-d1-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_remote_migration == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install
      - name: Verify pending migration list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list ksk-research-dev --remote
      - name: Apply pending migrations to remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote
      - name: Verify migration history after apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list ksk-research-dev --remote
