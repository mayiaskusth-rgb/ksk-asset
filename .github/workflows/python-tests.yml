name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "youtube-intelligence/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "youtube-intelligence/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-intelligence
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run sample scoring pipeline
        run: |
          yti score --input data/sample_videos.json --output runs/ci/outliers.csv
          test -s runs/ci/outliers.csv
