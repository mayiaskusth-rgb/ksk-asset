name: Manual satellite research probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch containing the satellite probe code"
        required: true
        type: string
        default: "experiment/satellite-no-api-probe"
      acknowledge_limits:
        description: "Confirm this is the bounded public-data probe (10 queries max, 5 results each)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: satellite-probe
  cancel-in-progress: false

jobs:
  bounded-search:
    if: ${{ inputs.acknowledge_limits }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: youtube-intelligence
    steps:
      - name: Check out probe code branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe and test dependencies
        run: python -m pip install -e ".[dev,probe]"
      - name: Run deterministic tests first
        run: pytest -q
      - name: Run bounded satellite search
        run: python -m yti.providers.yt_dlp_probe
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-probe-${{ github.run_number }}
          path: youtube-intelligence/runs/satellite_probe/
          if-no-files-found: warn
          retention-days: 7
