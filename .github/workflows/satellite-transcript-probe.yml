name: Satellite transcript probe

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Run the longest satellite result, a second long-form result, or both sequentially"
        required: true
        type: choice
        default: norsat-webinar
        options:
          - norsat-webinar
          - astrum-extra
          - both

permissions:
  contents: read

concurrency:
  group: satellite-transcript-probe
  cancel-in-progress: false

jobs:
  transcript-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: youtube-intelligence
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional transcript adapter
        run: python -m pip install -e ".[youtube,dev]"
      - name: Run bounded transcript probe
        run: |
          python scripts/run_transcript_probe.py \
            --sample "${{ inputs.sample }}" \
            --output runs/transcript-probe/report.json
      - name: Upload sanitized experiment report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-transcript-probe-${{ github.run_number }}
          path: youtube-intelligence/runs/transcript-probe/report.json
          if-no-files-found: warn
          retention-days: 14
