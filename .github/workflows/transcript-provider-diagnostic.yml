name: Transcript provider diagnostic (separate)

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Run the same single video against youtube-transcript-api"
        required: true
        type: choice
        default: norsat-webinar
        options:
          - norsat-webinar
          - astrum-extra

permissions:
  contents: read

concurrency:
  group: transcript-provider-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: youtube-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated diagnostic dependency
        run: python -m pip install -e ".[transcript-diagnostic]"
      - name: Run one-video diagnostic
        run: |
          python scripts/run_transcript_api_diagnostic.py \
            --sample "${{ inputs.sample }}" \
            --output runs/transcript-api-diagnostic/report.json
      - name: Upload sanitized report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-api-diagnostic-${{ github.run_number }}
          path: youtube-intelligence/runs/transcript-api-diagnostic/report.json
          if-no-files-found: warn
          retention-days: 14
